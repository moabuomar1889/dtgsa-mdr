packages:
  - "apps/*"
  - "packages/*"
disallowWorkspaceCycles: true
allowBuilds:
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@prisma/engines": false
  esbuild: false
  msw: false
  prisma: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  "brace-expansion@<=5.0.7": "5.0.8"
  "defu@<6.1.5": "6.1.5"
  "fast-uri@<3.1.4": "3.1.4"
  "hono@<4.12.25": "4.12.25"
  "js-yaml@<4.3.0": "4.3.0"
  "postcss@<8.5.18": "8.5.18"
  "sharp@<0.35.0": "0.35.3"
minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
